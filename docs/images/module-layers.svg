<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">How eslint-plugin-import-structure sees a project</title>
  <desc id="desc">The package.json imports aliases #app, #utils and #types each own a folder through its index.ts. Their order is the layer order: #app may import #utils, #utils may import #types. Importing a module's internal file through a deeper specifier such as #utils/format.ts is forbidden, and so is an upward import from #types to #utils, which would allow a cycle. Files inside one module import each other with relative paths.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="rel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656d76"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #1f2328; }
    .muted { fill: #656d76; }
    .green { fill: #1a7f37; }
    .red { fill: #cf222e; }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="918" height="598" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="24" y="38" class="sans ink" font-size="20" font-weight="600">Modules, layers, and aliases</text>

  <!-- left panel: package.json -->
  <rect x="24" y="60" width="344" height="168" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="86" class="sans muted" font-size="13" font-weight="600">package.json</text>
  <g class="mono ink" font-size="13">
    <text x="40" y="114">"imports": {</text>
    <text x="56" y="138"><tspan font-weight="700">"#app"</tspan>:<tspan x="148">"./src/app/index.ts",</tspan></text>
    <text x="56" y="162"><tspan font-weight="700">"#utils"</tspan>:<tspan x="148">"./src/utils/index.ts",</tspan></text>
    <text x="56" y="186"><tspan font-weight="700">"#types"</tspan>:<tspan x="148">"./src/types/index.ts"</tspan></text>
    <text x="40" y="210">}</text>
  </g>

  <g class="sans ink" font-size="14">
    <text x="24" y="262">Each alias owns its folder;</text>
    <text x="24" y="282">its <tspan class="mono">index.ts</tspan> is the only way in from outside.</text>
    <text x="24" y="314">Alias order is the layer order:</text>
    <text x="24" y="334">a module imports only aliases</text>
    <text x="24" y="354">listed below its own, so no cycles.</text>
  </g>

  <!-- legend -->
  <g class="sans ink" font-size="13">
    <text x="24" y="404" class="muted" font-weight="600">Legend</text>
    <line x1="24" y1="428" x2="74" y2="428" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ok)"/>
    <text x="86" y="432">allowed import</text>
    <line x1="24" y1="458" x2="74" y2="458" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bad)"/>
    <path d="M42 450 L56 466 M56 450 L42 466" stroke="#cf222e" stroke-width="2.5"/>
    <text x="86" y="462">reported import</text>
    <line x1="24" y1="488" x2="74" y2="488" stroke="#656d76" stroke-width="2" marker-end="url(#rel)"/>
    <text x="86" y="492">relative import inside a module</text>
    <rect x="24" y="508" width="50" height="24" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="86" y="525">entry point (<tspan class="mono">index.ts</tspan>)</text>
    <rect x="24" y="542" width="50" height="24" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="86" y="559">internal file</text>
  </g>

  <!-- modules -->
  <g class="sans" font-size="14">
    <!-- #app -->
    <rect x="400" y="60" width="496" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="416" y="86" class="ink"><tspan class="mono" font-weight="700">#app</tspan><tspan class="muted"> owns src/app/</tspan></text>
    <text x="880" y="86" class="muted" font-size="12" text-anchor="end">top layer</text>
    <rect x="560" y="104" width="130" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="625" y="129" class="mono ink" font-size="14" text-anchor="middle">index.ts</text>
    <rect x="745" y="104" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="810" y="129" class="mono ink" font-size="14" text-anchor="middle">page.ts</text>
    <line x1="692" y1="124" x2="741" y2="124" stroke="#656d76" stroke-width="2" marker-end="url(#rel)"/>

    <!-- #utils -->
    <rect x="400" y="250" width="496" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="416" y="276" class="ink"><tspan class="mono" font-weight="700">#utils</tspan><tspan class="muted"> owns src/utils/</tspan></text>
    <text x="880" y="276" class="muted" font-size="12" text-anchor="end">middle layer</text>
    <rect x="560" y="294" width="130" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="625" y="319" class="mono ink" font-size="14" text-anchor="middle">index.ts</text>
    <rect x="745" y="294" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="810" y="319" class="mono ink" font-size="14" text-anchor="middle">format.ts</text>
    <line x1="692" y1="314" x2="741" y2="314" stroke="#656d76" stroke-width="2" marker-end="url(#rel)"/>

    <!-- #types -->
    <rect x="400" y="440" width="496" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="416" y="466" class="ink"><tspan class="mono" font-weight="700">#types</tspan><tspan class="muted"> owns src/types/</tspan></text>
    <text x="880" y="466" class="muted" font-size="12" text-anchor="end">bottom layer</text>
    <rect x="560" y="484" width="130" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="625" y="509" class="mono ink" font-size="14" text-anchor="middle">index.ts</text>
    <rect x="745" y="484" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="810" y="509" class="mono ink" font-size="14" text-anchor="middle">user.ts</text>
    <line x1="692" y1="504" x2="741" y2="504" stroke="#656d76" stroke-width="2" marker-end="url(#rel)"/>
  </g>

  <!-- allowed: #app -> #utils, #utils -> #types -->
  <line x1="625" y1="172" x2="625" y2="290" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ok)"/>
  <text x="613" y="216" class="mono green" font-size="13" text-anchor="end">"#utils"</text>
  <line x1="625" y1="362" x2="625" y2="480" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ok)"/>
  <text x="613" y="406" class="mono green" font-size="13" text-anchor="end">"#types"</text>

  <!-- reported: deep import #utils/format.ts -->
  <line x1="810" y1="172" x2="810" y2="290" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bad)"/>
  <path d="M801 202 L819 220 M819 202 L801 220" stroke="#cf222e" stroke-width="2.5"/>
  <text x="794" y="208" class="mono red" font-size="13" text-anchor="end">"#utils/format.ts"</text>
  <text x="794" y="226" class="sans red" font-size="12" text-anchor="end">deep import</text>

  <!-- reported: upward import #types -> #utils -->
  <line x1="870" y1="438" x2="870" y2="364" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bad)"/>
  <path d="M861 392 L879 410 M879 392 L861 410" stroke="#cf222e" stroke-width="2.5"/>
  <text x="852" y="398" class="mono red" font-size="13" text-anchor="end">"#utils"</text>
  <text x="852" y="416" class="sans red" font-size="12" text-anchor="end">upward import</text>
</svg>
